<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarFlare</title>
  <link rel="stylesheet" href="assets\style.css">
</head>
<body>
  <div class="grid-container">
    <header class="header">Solarflare</header>
    
    <aside class="sidebar">
      <h3>Categorías</h3>
      <ul>
        <li>Controladores (1)</li>
        <li>Inversores (1)</li>
        <li>Baterias (1)</li>
        <li>Paneles solares (1)</li>
      </ul>
    </aside>
    
    <main class="main">
      <div class="product-card">
        <img src="assets\img\bateria.jpg" alt="Bateria de litio">
        <h4>Bateria de litio</h4>
        <p>310.400</p>
        <button>Comprar</button>
      </div>

      <div class="product-card">
        <img src="assets\img\controlador.jpg" alt="Controlador">
        <h4>Controlador de carga</h4>
        <p>28.900</p>
        <button>Comprar</button>
      </div>

      <div class="product-card">
        <img src="assets\img\inversor.png" alt="Inversor 12-220v">
        <h4>Inversor 12-220v</h4>
        <p>29.700</p>
        <button>Comprar</button>
      </div>

      <div class="product-card">
        <img src="assets\img\panel-solar.png" alt="Panel solar">
        <h4>Panel solar</h4>
        <p>74.700</p>
        <button>Comprar</button>
      </div>
    </main>

    <footer class="footer">
      © 2025 Solarflare.cl 
    </footer>
  </div>
</body>
</html>
